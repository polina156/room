<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки корпуса</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer ></script>
</head>
<body>
   <div class="container">
    <h1>Заявки корпуса</h1>

    <section class="form-section">
      <div class="field">
        <label for="titleInput">Что случилось?</label>
        <input type="text" id="titleInput" placeholder="Например, не включается проектор">
      </div>
      <div class="field">
        <label for="roomInput">Где?</label>
        <input type="text" id="roomInput" placeholder="Например, 203">
      </div>
      <div class="field">
        <label for="categorySelect">Категория</label>
        <select id="categorySelect">
          <option value="">Выберите категорию</option>
          <option value="Оборудование">Оборудование</option>
          <option value="Аудитория">Аудитория</option>
          <option value="Другое">Другое</option>
        </select>
      </div>
      
    <button id="addbtn">Добавить заявку</button>

  
    
</body>
</html>
